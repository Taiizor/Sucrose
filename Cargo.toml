[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# The C# app (src/) and experiments (exp/, e.g. the GPUI prototype) are not part of the workspace.
exclude = ["src", "exp"]

[workspace.package]
version = "26.11.22+1"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.99"
publish = false

# Central dependency versions (like Directory.Packages.props). Members use `dep = { workspace = true }`.
[workspace.dependencies]
sucrose-config = { path = "crates/sucrose-config" }
sucrose-core = { path = "crates/sucrose-core" }
sucrose-engine = { path = "crates/sucrose-engine" }
sucrose-engine-cef = { path = "crates/sucrose-engine-cef" }
sucrose-engine-mpv = { path = "crates/sucrose-engine-mpv" }
sucrose-ipc = { path = "crates/sucrose-ipc" }
sucrose-log = { path = "crates/sucrose-log" }
sucrose-platform = { path = "crates/sucrose-platform" }

anyhow = "1"
# Awaitable channel from the Portal's IPC threads to the GPUI thread (crossbeam receivers cannot be awaited); GPUI already depends on it.
async-channel = "2.5"
bindgen = "0.73.2"
# xtask only: decodes the pinned CEF tar.bz2 archive.
bzip2 = "0.6.1"
# D-013, D-32: the CEF Rust bindings (crate 156.7.0 carries CEF 156.0.31 as build metadata; cargo ignores metadata in requirements), built against the pinned dist through CEF_PATH (never downloads); libcef.dll is delay-loaded by the binaries that host CEF.
cef = { version = "=156.7.0", default-features = false }
crossbeam-channel = "0.5.17"
dirs = "6"
gpui-kit = "=0.10.0"
# Test builds of the Portal only: GPUI test context and Window::has_image_atlas_entry. The same crate gpui-kit builds on, so only its test-support dependencies are new.
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
# Image decoding and encoding; GPUI already depends on ^0.25, so the Portal shares the copy. Default features off.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff"] }
interprocess = "2.4.9"
# JPEG decoding with DCT scaling (a thumbnail never exists at full size); default features off drops rayon.
jpeg-decoder = { version = "0.3.2", default-features = false }
libloading = "0.9.1"
postcard = { version = "1.2.0", features = ["use-std"] }
# The native handle of a GPUI window (gpui Window implements HasWindowHandle) for the DWM backdrop call in sucrose-platform; GPUI already depends on 0.6.2, so no second copy is built.
raw-window-handle = "0.6.2"
rust-i18n = "4.2.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.25.0"
sha2 = "0.11.1"
# Only the process/system part: no rayon, disks, networks or components (xtask measure reads process statistics).
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
# xtask only: reads the pinned CEF tar.bz2 archive entry by entry.
tar = "0.4.46"
thiserror = "2"
toml = "1.2.2"
# Recycle bin / trash on every OS, behind sucrose-platform (D-09): corrupt themes are moved there, never deleted.
trash = "5.4.0"
# Default features off: the default one is the Linux GTK AppIndicator backend (Windows only, via sucrose-platform).
tray-icon = { version = "0.26.1", default-features = false }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = "3.5.2"
# Same version interprocess 2.4.9 already depends on, so no second copy is built.
widestring = "1.2.1"
windows = "0.62.2"

[workspace.lints.rust]
# D-011: only sucrose-platform and engine/FFI crates may opt out with #![allow(unsafe_code)].
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
# Dependencies (GPUI, image decoding) are optimized even in dev builds; our crates stay fast to compile.
opt-level = 3

[profile.release]
lto = "thin"
strip = true