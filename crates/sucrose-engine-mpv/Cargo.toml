[package]
name = "sucrose-engine-mpv"
description = "libmpv engine: runtime-loaded bindings, loader and player for video wallpapers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libloading = { workspace = true }
sucrose-core = { workspace = true }
sucrose-ipc = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# Exposes Player::open_source_for_tests (any mpv source string, no window) to the integration tests only.
test-support = []

[dev-dependencies]
sucrose-engine-mpv = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
