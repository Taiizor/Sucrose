[package]
name = "sucrose-engine-cef"
description = "CEF engine: the pinned Chromium Embedded Framework, delay-loaded, for web wallpapers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
crossbeam-channel = { workspace = true }
sucrose-core = { workspace = true }
sucrose-engine = { workspace = true }
sucrose-ipc = { workspace = true }
sucrose-platform = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(all(windows, any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
cef = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
