[package]
name = "sucrose-engine-webview2"
description = "WebView2 engine: the user-installed Microsoft Edge WebView2 Runtime, for web wallpapers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
crossbeam-channel = { workspace = true }
sucrose-core = { workspace = true }
sucrose-engine = { workspace = true }
sucrose-engine-web = { workspace = true }
sucrose-ipc = { workspace = true }
sucrose-platform = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
