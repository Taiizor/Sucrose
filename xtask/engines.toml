# Pinned engine archives for `cargo xtask fetch-engines` (D-016, D-028, D-32).
# Every archive is verified against its sha256 before it is opened; a mismatch deletes it and fails.
# Binaries are never committed. libmpv (7z, one DLL and one header) is downloaded into target/engines/<arch>/ and the
# DLL is copied next to the dev exe. CEF (tar.bz2, layout = "tree") is extracted whole into
# target/engines/cef/<cef_version>/<os_arch>/, the folder cef-dll-sys reads through CEF_PATH (.cargo/config.toml).
# `url` may later point at a mirror (the upstream release disappears after a few weeks); the hash never changes.
# When the pinned client.h changes, regenerate crates/sucrose-engine-mpv/src/sys.rs with cargo xtask bindgen-mpv.
# CEF rows: the CEF index publishes only SHA1 (upstream_sha1, compared by hand once when pinning); sha256 comes from
# `cargo xtask fetch-engines --engine cef --arch <arch> --print-sha256`.

[[engine]]
name = "libmpv"
arch = "x86_64"
url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z"
sha256 = "273c079b11ea5575822f972756f4c9a71149a5c10130353abeb8586738938452"
size = 31776374
file = "libmpv-2.dll"
header = "include/mpv/client.h"
upstream_repo = "shinchiro/mpv-winbuild-cmake"
upstream_tag = "20261111"
upstream_commit = "bcde6b93cc"
mpv_version = "v0.42.0-38-gbcde6b93c"
client_api = "2.6"
license = "GPL-2.0-or-later"

